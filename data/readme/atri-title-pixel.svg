<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 340 90" fill="none">
  <defs>
    <!-- Subtle bloom/glow for the pixel art -->
    <filter id="bloom" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur in="SourceGraphic" stdDeviation="1.5" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <!-- Scanline pattern -->
    <pattern id="scanlines" patternUnits="userSpaceOnUse" width="4" height="4">
      <rect width="4" height="2" fill="transparent"/>
      <rect y="2" width="4" height="2" fill="rgba(0,0,0,0.06)"/>
    </pattern>
  </defs>

  <!-- Pixel grid: each "pixel" is 6x6, letters on a 5x7 grid with 2px gap between letters -->
  <!-- Total width: 4 letters * 5 pixels * 6px + 3 gaps * 12px = 120 + 36 = 156px, centered -->
  <!-- Offset X = (340 - 156) / 2 = 92 -->

  <g filter="bloom" transform="translate(92, 12)">
    <!-- A - 5x7 pixel grid -->
    <g fill="#e8556d">
      <!-- Row 0 -->          <rect x="6" y="0" width="6" height="6" rx="1"/><rect x="12" y="0" width="6" height="6" rx="1"/><rect x="18" y="0" width="6" height="6" rx="1"/>
      <!-- Row 1 --> <rect x="0" y="6" width="6" height="6" rx="1"/>                                                                                                            <rect x="24" y="6" width="6" height="6" rx="1"/>
      <!-- Row 2 --> <rect x="0" y="12" width="6" height="6" rx="1"/>                                                                                                            <rect x="24" y="12" width="6" height="6" rx="1"/>
      <!-- Row 3 --> <rect x="0" y="18" width="6" height="6" rx="1"/><rect x="6" y="18" width="6" height="6" rx="1"/><rect x="12" y="18" width="6" height="6" rx="1"/><rect x="18" y="18" width="6" height="6" rx="1"/><rect x="24" y="18" width="6" height="6" rx="1"/>
      <!-- Row 4 --> <rect x="0" y="24" width="6" height="6" rx="1"/>                                                                                                            <rect x="24" y="24" width="6" height="6" rx="1"/>
      <!-- Row 5 --> <rect x="0" y="30" width="6" height="6" rx="1"/>                                                                                                            <rect x="24" y="30" width="6" height="6" rx="1"/>
      <!-- Row 6 --> <rect x="0" y="36" width="6" height="6" rx="1"/>                                                                                                            <rect x="24" y="36" width="6" height="6" rx="1"/>
    </g>

    <!-- T - offset by 30 + 12 = 42 -->
    <g fill="#e8556d" transform="translate(42, 0)">
      <!-- Row 0 --> <rect x="0" y="0" width="6" height="6" rx="1"/><rect x="6" y="0" width="6" height="6" rx="1"/><rect x="12" y="0" width="6" height="6" rx="1"/><rect x="18" y="0" width="6" height="6" rx="1"/><rect x="24" y="0" width="6" height="6" rx="1"/>
      <!-- Row 1-6 -->                                               <rect x="12" y="6" width="6" height="6" rx="1"/>
                                                                     <rect x="12" y="12" width="6" height="6" rx="1"/>
                                                                     <rect x="12" y="18" width="6" height="6" rx="1"/>
                                                                     <rect x="12" y="24" width="6" height="6" rx="1"/>
                                                                     <rect x="12" y="30" width="6" height="6" rx="1"/>
                                                                     <rect x="12" y="36" width="6" height="6" rx="1"/>
    </g>

    <!-- R - offset by 42 + 30 + 12 = 84 -->
    <g fill="#e8556d" transform="translate(84, 0)">
      <!-- Row 0 --> <rect x="0" y="0" width="6" height="6" rx="1"/><rect x="6" y="0" width="6" height="6" rx="1"/><rect x="12" y="0" width="6" height="6" rx="1"/><rect x="18" y="0" width="6" height="6" rx="1"/>
      <!-- Row 1 --> <rect x="0" y="6" width="6" height="6" rx="1"/>                                                                                                <rect x="24" y="6" width="6" height="6" rx="1"/>
      <!-- Row 2 --> <rect x="0" y="12" width="6" height="6" rx="1"/>                                                                                                <rect x="24" y="12" width="6" height="6" rx="1"/>
      <!-- Row 3 --> <rect x="0" y="18" width="6" height="6" rx="1"/><rect x="6" y="18" width="6" height="6" rx="1"/><rect x="12" y="18" width="6" height="6" rx="1"/><rect x="18" y="18" width="6" height="6" rx="1"/>
      <!-- Row 4 --> <rect x="0" y="24" width="6" height="6" rx="1"/>                              <rect x="12" y="24" width="6" height="6" rx="1"/>
      <!-- Row 5 --> <rect x="0" y="30" width="6" height="6" rx="1"/>                                                   <rect x="18" y="30" width="6" height="6" rx="1"/>
      <!-- Row 6 --> <rect x="0" y="36" width="6" height="6" rx="1"/>                                                                        <rect x="24" y="36" width="6" height="6" rx="1"/>
    </g>

    <!-- I - offset by 84 + 30 + 12 = 126 -->
    <g fill="#e8556d" transform="translate(126, 0)">
      <!-- Row 0 --> <rect x="0" y="0" width="6" height="6" rx="1"/><rect x="6" y="0" width="6" height="6" rx="1"/><rect x="12" y="0" width="6" height="6" rx="1"/>
      <!-- Row 1-5 -->                                               <rect x="6" y="6" width="6" height="6" rx="1"/>
                                                                     <rect x="6" y="12" width="6" height="6" rx="1"/>
                                                                     <rect x="6" y="18" width="6" height="6" rx="1"/>
                                                                     <rect x="6" y="24" width="6" height="6" rx="1"/>
                                                                     <rect x="6" y="30" width="6" height="6" rx="1"/>
      <!-- Row 6 --> <rect x="0" y="36" width="6" height="6" rx="1"/><rect x="6" y="36" width="6" height="6" rx="1"/><rect x="12" y="36" width="6" height="6" rx="1"/>
    </g>
  </g>

  <!-- Scanline overlay -->
  <rect x="92" y="12" width="156" height="42" fill="url(#scanlines)" opacity="0.4"/>

  <!-- Subtitle: My Dear Moments - small pixel text below -->
  <text x="170" y="72" font-family="'Courier New', monospace" font-size="9" fill="#e8556d" text-anchor="middle" letter-spacing="3" opacity="0.6">MY DEAR MOMENTS</text>
</svg>
